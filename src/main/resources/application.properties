spring.application.name=ms-admin-mensajeria
server.port=8085
server.error.include-message=always

# JWT emitido por Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
# Grupo de Cognito autorizado a administrar (claim cognito:groups)
admin.grupo=${ADMIN_GRUPO:admin}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

management.endpoints.web.exposure.include=health,info
